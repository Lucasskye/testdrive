<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Girlfriend Day</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Musik -->
    <audio id="bgMusic" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <!-- Loading -->
    <div id="loading">
        <div class="loader"></div>
    </div>

    <!-- Halaman Pembuka -->
    <section class="hero">

        <div class="gift-container">

            <p class="small-text">
                 I have a gift for you🎁
            </p>

            <div class="gift" id="gift">

                <div class="gift-top"></div>

                <div class="gift-body"></div>

                <div class="ribbon vertical"></div>

                <div class="ribbon horizontal"></div>

            </div>

        </div>

    </section>

    <!-- Isi Website -->
    <section class="content hidden" id="content">

        <h1 class="title">
            Happy Girlfriend Day sayang❤️
        </h1>

        <p class="subtitle">
            trimakasih karna memilih ku
        </p>

        <!-- Galeri Foto -->

        <div class="gallery">

            <div class="photo-card">

                <img src="photo1.jpg">

                <p>
                    kamu tampak indah di foto ini
                </p>

            </div>

            <div class="photo-card">

                <img src="photo2.jpg">

                <p>
                    seperti bulan di malam hari
                </p>

            </div>

            <div class="photo-card">

                <img src="photo3.jpg">

                <p>
                    ingin diriku mentap mu tiap hari
                </p>

            </div>

            <div class="photo-card">

                <img src="photo4.jpg">

                <p>
                    seperti bunga menatap matahari 
                </p>

            </div>

            <div class="photo-card">

                <img src="photo5.jpg">

                <p>
                    dan seperti tanaman yang memerlukan 
                </p>

            </div>

            <div class="photo-card">

                <img src="photo6.jpg">

                <p>
                    "matahari"
                </p>

            </div>

        </div>

    </section>

    <script src="script.js"></script>

</body>
</html>
